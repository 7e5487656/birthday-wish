<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Wish Generator</title>
  <style>
    :root {
      --bg-color: #0f0f13;
      --panel-bg: #1e1e2e;
      --text-main: #e5e7eb;
      --accent: #6366f1;
      --code-bg: #000000;
      --success: #22c55e;
      --border: #2b2b3b;
      --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
      --font-sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --panel-bg: #ffffff;
      --text-main: #111827;
      --accent: #4f46e5;
      --code-bg: #f5f5f5;
      --success: #16a34a;
      --border: #e5e7eb;
    }

    body { margin: 0; background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-sans); display: flex; flex-direction: column; min-height: 100vh; }
    
    header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(15,15,19,0.9); backdrop-filter: blur(10px); }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); font-weight: 700; }
    .status-bar { display: inline-block; padding: 0.3rem 0.8rem; background: var(--success); color: #000; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }
    .theme-switch { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; padding: 2rem; flex: 1; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } header { flex-direction: column; gap: 1rem; text-align: center; } }

    .panel { background: var(--panel-bg); padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border: 1px solid var(--border); height: 80%; display: flex; flex-direction: column; }

    /* Loader */
    .loader-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-main); }
    .terminal-text { font-family: var(--font-mono); font-size: 1.2rem; margin-bottom: 1rem; }
    .progress-bar-container { width: 300px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }

    pre { margin: 0; white-space: pre-wrap; line-height: 1.6; color: var(--text-main); flex: 1; overflow-y: auto; font-family: var(--font-mono); }
    button.copy-btn { margin-top: 1rem; padding: 0.75rem 1.5rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; align-self: flex-end; }
    button.copy-btn:hover { background: #4338ca; }

    footer { padding: 1.5rem 2rem; border-top: 1px solid var(--border); text-align: center; font-size: 0.9rem; color: #9ca3af; }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loader" class="loader-screen">
    <div class="terminal-text">INITIALIZING BIRTHDAY PROTOCOL...</div>
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
    <p style="font-size: 0.8rem; color: #6b7280; margin-top: 1rem;">Загрузка модулей... (это займет всего пару секунд)</p>
  </div>

  <header>
    <h1>BIRTHDAY_WISH_GENERATOR.py</h1>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <span class="status-bar" id="status">STATUS: IDLE</span>
      <button class="theme-switch" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
    </div>
  </header>

  <div class="layout" id="content-area" style="opacity: 0; transition: opacity 0.5s;">
    <!-- Результат -->
    <div class="panel">
      <h2>Compiled Output</h2>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0;">
      <pre id="output-log">Waiting for compilation...</pre>
    </div>

    <!-- Код -->
    <div class="panel">
      <h2>Source Code</h2>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0;">
      <pre id="source-code"></pre>
      <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
    </div>
  </div>

  <footer>Generated by Alice AI | Emulated Python Engine</footer>

  <script>
    // === НАСТРОЙКИ ===
    const USER_NAME = "[ИМЯ_ДРУГА]"; // <--- ВПИШИ ИМЯ СЮДА ОБЯЗАТЕЛЬНО
    const BIRTH_DATE_STRING = "04.09.2002";

    // 1. Формируем "Исходный код" (для красоты)
    const pythonCodeString = `
# =============================================================================
# BIRTHDAY_WISH_GENERATOR.py
# Version: 4.2.9-alpha
# Target: ${USER_NAME}
# Release Date: 04.09.2022
# Dependencies: humor_engine, colleague_module, birthday_core
# =============================================================================

import datetime

class Config:
    BIRTH_DATE = "${BIRTH_DATE_STRING}"
    USER_NAME = "${USER_NAME}"

def generate_wish():
    # ... логика скрыта в модулях ...
    return "Результат сгенерирован"

if __name__ == "__main__":
    print(generate_wish())
    `.trim();

    document.getElementById('source-code').textContent = pythonCodeString;

    function toggleTheme() {
      document.body.toggleAttribute('data-theme');
    }

    // 2. ЭМУЛЯЦИЯ "КОМПИЛЯЦИИ" НА JS (вместо тяжелого Pyodide)
    async function fakeCompile() {
      const log = document.getElementById('output-log');
      const status = document.getElementById('status');
      
      log.textContent = "Initializing birthday protocol for " + USER_NAME + "...\n";
      await sleep(500);
      log.textContent += "Loading profile data... OK.\n";
      await sleep(400);
      log.textContent += "Parsing birth date: " + BIRTH_DATE_STRING + " -> Calculating experience points...\n";
      await sleep(600);

      // Расчет возраста на JS
      const parts = BIRTH_DATE_STRING.split('.');
      const birthYear = parseInt(parts[2]);
      const currentYear = new Date().getFullYear();
      const age = currentYear - birthYear;

      log.textContent += `\n🎉 С Днём Рождения, ${USER_NAME}! 🎉\n`;
      log.textContent += `Сегодня твой уровень прокачан до ${age} лет! XP получен.\n`;
      log.textContent += "Статус системы: ONLINE. Критических ошибок не обнаружено.\n\n";
      
      await sleep(300);
      
      log.textContent += "Ты — тот самый коллега, чей код (и жизнь) не требует рефакторинга:\n";
      log.textContent += "   • Дедлайн? Это просто успешно закрытый тикет с запасом времени.\n";
      log.textContent += "   • Проблема? Это мелкий баг, который исправляется одной шуткой.\n";
      log.textContent += "   • Идея? Это идеальный промпт, который сразу выдает SoTA-результат.\n";
      log.textContent += "   • Поддержка? Это стабильный микросервис, который никогда не падает.\n\n";
      
      await sleep(400);

      log.textContent += "Пожелания в формате JSON:\n";
      log.textContent += "{\n";
      log.textContent += '  "goals": ["pass_validation_on_first_try", "merge_request_approved_instantly"],\n';
      log.textContent += '  "luck": {"type": "perpetual", "api_key": "UNLIMITED"},\n';
      log.textContent += '  "bugs": {"severity": "cosmetic", "fix_time": "0.5 seconds"},\n';
      log.textContent += '  "coffee": {"level": "infinite", "temperature": "perfect"}\n';
      log.textContent += "}\n\n";

      await sleep(400);

      log.textContent += "Пусть этот год будет как успешный коммит:\n";
      log.textContent += "- Без конфликтов (merge conflicts: 0)\n";
      log.textContent += "- С чистым кодом (style_guide: passed)\n";
      log.textContent += "- И с большим количеством фич (new_features: +1000)\n\n";
      
      await sleep(200);

      log.textContent += "---\nStatus: WISH_GENERATED_SUCCESSFULLY\n";
      status.textContent = "STATUS: COMPILATION_OK";
      status.style.background = "#16a34a";
    }

    // Функция задержки для анимации
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Анимация прогресс-бара
    function startProgressBar() {
      const bar = document.getElementById('progress');
      let width = 0;
      const interval = setInterval(() => {
        if (width >= 100) {
          clearInterval(interval);
        } else {
          width += Math.random() * 8;
          if (width > 100) width = 100;
          bar.style.width = width + '%';
        }
      }, 50);
    }

    function hideLoader() {
      const loader = document.getElementById('loader');
      const content = document.getElementById('content-area');
      loader.style.display = 'none';
      content.style.opacity = '1';
    }

    async function init() {
      startProgressBar();
      await fakeCompile();
      hideLoader();
    }

    init();

    function copyCode() {
      navigator.clipboard.writeText(pythonCodeString).then(() => {
        alert("Код скопирован!");
      });
    }
  </script>
</body>
</html>
